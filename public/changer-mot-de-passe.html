<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Changer mon mot de passe — Électrotechnique</title>
<link rel="icon" href="img/logo.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0F6C7C">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Électrotechnique">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="top-rule"></div>
<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="brand">
      <img src="img/logo.png" alt="Logo">
      <span class="brand-text">Section<strong>Électrotechnique</strong></span>
    </a>
    <div></div>
    <div class="header-actions">
      <div class="theme-switch">
        <button data-mode="clair" title="Thème clair">CLR</button>
        <button data-mode="sombre" title="Thème sombre">SOM</button>
        <button data-mode="systeme" title="Suivre le système">SYS</button>
      </div>
      <button id="install-app-btn" class="btn btn-jaune btn-sm hidden">Installer l'app</button>
    </div>
  </div>
</header>

<section class="admin-shell">
  <div class="container">
    <div class="login-box">
      <h2>Première connexion</h2>
      <p style="color:var(--text-soft);font-size:.88rem;">Votre mot de passe est provisoire. Choisissez-en un nouveau, personnel, avant de continuer.</p>
      <label style="font-size:.82rem;font-weight:700;">Nouveau mot de passe</label>
      <input id="new-pass" type="password" placeholder="6 caractères minimum">
      <label style="font-size:.82rem;font-weight:700;">Confirmer le mot de passe</label>
      <input id="new-pass2" type="password" placeholder="Retapez le mot de passe">
      <button class="btn btn-jaune" style="width:100%;" id="save-btn">Valider mon mot de passe</button>
      <p id="err" style="color:var(--rouge);font-size:.82rem;margin-top:10px;"></p>
    </div>
  </div>
</section>

<script src="js/main.js"></script>
<script src="js/app.js"></script>
<script>
(async ()=>{
  const { user } = await apiGet("/auth/me");
  if(!user){ location.href = "connexion.html"; return; }
  if(!user.mustChangePassword){ await routeByAuthState(); }
})();

document.getElementById("save-btn").addEventListener("click", async ()=>{
  const errEl = document.getElementById("err");
  errEl.textContent = "";
  const p1 = document.getElementById("new-pass").value;
  const p2 = document.getElementById("new-pass2").value;
  if(p1 !== p2){ errEl.textContent = "Les deux mots de passe ne correspondent pas."; return; }
  try{
    await apiPost("/auth/change-password", { newPassword: p1 });
    await routeByAuthState();
  }catch(e){ errEl.textContent = e.message; }
});
</script>
</body>
</html>
