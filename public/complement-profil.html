<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Compléter mon profil — Électrotechnique</title>
<link rel="icon" href="img/logo.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0F6C7C">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Électrotechnique">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="top-rule"></div>
<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="brand">
      <img src="img/logo.png" alt="Logo">
      <span class="brand-text">Section<strong>Électrotechnique</strong></span>
    </a>
    <div></div>
    <div class="header-actions">
      <div class="theme-switch">
        <button data-mode="clair" title="Thème clair">CLR</button>
        <button data-mode="sombre" title="Thème sombre">SOM</button>
        <button data-mode="systeme" title="Suivre le système">SYS</button>
      </div>
      <button id="install-app-btn" class="btn btn-jaune btn-sm hidden">Installer l'app</button>
    </div>
  </div>
</header>

<section class="admin-shell">
  <div class="container">
    <div class="login-box">
      <h2>Bienvenue !</h2>
      <p style="color:var(--text-soft);font-size:.88rem;">Avant de continuer, indiquez votre classe et votre identité.</p>
      <label style="font-size:.82rem;font-weight:700;">Prénom</label>
      <input id="prenom" type="text" placeholder="Prénom">
      <label style="font-size:.82rem;font-weight:700;">Nom</label>
      <input id="nom" type="text" placeholder="Nom">
      <label style="font-size:.82rem;font-weight:700;">Classe</label>
      <select id="classe"><option value="">— Choisir —</option></select>
      <button class="btn btn-jaune" style="width:100%;margin-top:16px;" id="save-btn">Valider mon profil</button>
      <p id="err" style="color:var(--rouge);font-size:.82rem;margin-top:10px;"></p>
    </div>
  </div>
</section>

<script src="js/main.js"></script>
<script src="js/app.js"></script>
<script>
(async ()=>{
  const { user } = await apiGet("/auth/me");
  if(!user){ location.href = "connexion.html"; return; }
  if(user.mustChangePassword){ location.href = "changer-mot-de-passe.html"; return; }
  if(user.profileComplete){ await routeByAuthState(); return; }
})();

async function loadClasses(){
  const r = await fetch("/api/classes-publiques");
  const data = await r.json();
  const sel = document.getElementById("classe");
  data.classes.forEach(c=>{
    const opt = document.createElement("option");
    opt.value = c.id;
    opt.textContent = c.name + (c.option ? " — " + c.option : "");
    sel.appendChild(opt);
  });
}
loadClasses();

document.getElementById("save-btn").addEventListener("click", async ()=>{
  const errEl = document.getElementById("err");
  errEl.textContent = "";
  try{
    await apiPost("/auth/complete-profile", {
      classId: document.getElementById("classe").value,
      nom: document.getElementById("nom").value,
      prenom: document.getElementById("prenom").value
    });
    await routeByAuthState();
  }catch(e){ errEl.textContent = e.message; }
});
</script>
</body>
</html>
